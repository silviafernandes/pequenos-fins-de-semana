name: Atualizar e publicar a agenda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actions suporta timezone. A execução pode sofrer atrasos.
    - cron: '13 9 * * *'
      timezone: 'Europe/Lisbon'
    # Reforço às sextas após o horário habitual de inscrição da biblioteca.
    - cron: '07 10,11,13,16 * * 5'
      timezone: 'Europe/Lisbon'
    - cron: '37 10 * * 5'
      timezone: 'Europe/Lisbon'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar bibliotecas da recolha
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Testar extratores
        run: python -m unittest discover -s tests -v
      - name: Instalar leitura de cartazes
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Procurar novos anúncios
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event_name != 'push' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.event_name != 'push' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python scripts/update.py
      - name: Guardar as novidades no repositório
        run: |
          git config user.name "pequenos-fds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/events.json public/data/history.json public/data/discoveries.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar agenda e fontes públicas"
            git push
          else
            echo "Sem alterações"
          fi
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar frontend
        run: npm ci --no-audit --no-fund
      - name: Compilar aplicação
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros de publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
