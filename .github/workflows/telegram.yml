name: Verificar alertas Telegram

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram.yml'
      - 'scripts/telegram_alerts.py'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Enviar uma única mensagem TESTE para a conversa configurada'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: telegram-delivery-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verificar configuração ou testar entrega
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && '1' || '0' }}
        run: |
          if [ "$SEND_TEST" = "1" ]; then
            python scripts/telegram_alerts.py --send-test
          else
            python scripts/telegram_alerts.py
          fi
